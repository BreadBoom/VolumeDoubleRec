name: Build APK

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
    
    - name: Make gradlew executable
      run: |
        cd VolumeDoubleRec
        chmod +x gradlew
    
    - name: Build APK
      run: |
        cd VolumeDoubleRec
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: VolumeDoubleRec/app/build/outputs/apk/debug/app-debug.apk
